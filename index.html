<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Party Pals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: loud, friendly couch-party game
   IDEA: a toy console screen in a candy-coloured housing
   PICTURE: the live game canvas itself, filling the screen
   COLOUR and TYPE: deep grape housing, four bright player colours, Baloo 2
   LAYOUT: canvas centred and scaled to fit, control hints underneath */
:root{color-scheme:dark;--bg:#1d1433;--ink:#f6f0ff}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 30%,#2e2152,#140d26 70%);color:var(--ink);font:15px/1.4 "Baloo 2",system-ui,sans-serif;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
canvas{display:block;border-radius:18px;box-shadow:0 0 0 6px #3a2a66,0 0 0 10px #ff5a4e,0 20px 60px rgba(0,0,0,.6);background:#2a1f4a;touch-action:none;outline:none}
#hint{font-size:13px;opacity:.75;text-align:center}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720" tabindex="0" aria-label="Party Pals game screen"></canvas>
<div id="hint">Keyboard: P1 WASD+Q · P2 IJKL+U · P3 Arrows+Enter · P4 Numpad 8456+0 · Controllers: A/B = action, + = start, L/R = free play</div></div>
<script>
{
'use strict';
const W=1280,H=720,FONT='"Baloo 2",system-ui,sans-serif',OUT='#1c1233';
const cv=document.getElementById('c'),g=cv.getContext('2d');
function fit(){const s=Math.min((innerWidth-24)/W,(innerHeight-50)/H);cv.style.width=Math.max(200,W*s)+'px';cv.style.height=Math.max(112,H*s)+'px';}
addEventListener('resize',fit);fit();

const COLORS=['#ff5a4e','#4e8dff','#3ccf6e','#ffc93c'];
const NAMES=['Red','Blue','Green','Yellow'];
const TEAMC=['#ff9f1c','#c77dff'],TEAMN=['Orange','Purple'];
const MODE_TAG={ffa:'1v1v1v1','2v2':'2 vs 2','1v3':'1 vs 3',coop:'Co-op'};
const MODE_COL={ffa:'#ff9f1c','2v2':'#c77dff','1v3':'#ff5a4e',coop:'#3ccf6e'};
const rnd=(a,b)=>a+Math.random()*(b-a),ri=n=>Math.floor(Math.random()*n),clamp=(v,a,b)=>v<a?a:v>b?b:v;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=ri(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
function shade(hex,a){const n=parseInt(hex.slice(1),16);let r=n>>16,gg=n>>8&255,b=n&255;if(a>0){r+=(255-r)*a;gg+=(255-gg)*a;b+=(255-b)*a;}else{r*=1+a;gg*=1+a;b*=1+a;}return'rgb('+(r|0)+','+(gg|0)+','+(b|0)+')';}
let GT=0;

// ---------- sound ----------
let actx=null;
function beep(f=440,d=0.08,type='square',v=0.04){try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime,o=actx.createOscillator(),gn=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(gn).connect(actx.destination);o.start(t);o.stop(t+d+0.02);}catch(e){}}

// ---------- particles & shake ----------
const parts=[];let shake=0;
function burst(x,y,col,n=10,sp=220){for(let i=0;i<n;i++){const a=Math.random()*7,v=rnd(.3,1)*sp;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,t:0,life:rnd(.35,.7),col:Array.isArray(col)?col[i%col.length]:col,r:rnd(3,7)});}}
function stepParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.vx*=.98;if(p.t>p.life)parts.splice(i,1);}}
function drawParts(){for(const p of parts){g.globalAlpha=Math.max(0,1-p.t/p.life);g.fillStyle=p.col;g.beginPath();g.arc(p.x,p.y,p.r*(1-p.t/p.life*.5),0,7);g.fill();}g.globalAlpha=1;}
const kick=s=>{shake=Math.max(shake,s);};

// ---------- input ----------
const keys={},hit=new Set();
addEventListener('keydown',e=>{if(!e.repeat)hit.add(e.code);keys[e.code]=true;if(/^Arrow|Space|Tab|Enter|Slash|Numpad|Backspace/.test(e.code))e.preventDefault();});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
const kp=c=>hit.has(c);
const KEYSETS=[
 {name:'Keyboard WASD + Q',up:'KeyW',down:'KeyS',left:'KeyA',right:'KeyD',act:'KeyQ'},
 {name:'Keyboard IJKL + U',up:'KeyI',down:'KeyK',left:'KeyJ',right:'KeyL',act:'KeyU'},
 {name:'Keyboard Arrows + Enter',up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight',act:'Enter'},
 {name:'Keyboard Numpad + 0',up:'Numpad8',down:'Numpad5',left:'Numpad4',right:'Numpad6',act:'Numpad0'}];
const DEV_IDS=['k0','k1','k2','k3','p0','p1','p2','p3'];
function pads(){try{return navigator.getGamepads?Array.from(navigator.getGamepads()):[];}catch(e){return [];}}
let padCache=[];
function readDev(id){
 if(id[0]==='k'){const m=KEYSETS[+id[1]];return{x:(keys[m.right]?1:0)-(keys[m.left]?1:0),y:(keys[m.down]?1:0)-(keys[m.up]?1:0),act:!!keys[m.act]||hit.has(m.act)};}
 const p=padCache[+id[1]];if(!p||!p.connected)return{x:0,y:0,act:false};
 let x=p.axes[0]||0,y=p.axes[1]||0;if(Math.hypot(x,y)<0.3){x=0;y=0;}
 const b=i=>!!(p.buttons[i]&&p.buttons[i].pressed);
 if(b(14))x=-1;if(b(15))x=1;if(b(12))y=-1;if(b(13))y=1;
 return{x,y,act:b(0)||b(1)||b(2)||b(3)};
}
const devState={},devPressed={},devBtn={},padPrevBtn={},btnPrev={};
function padEdge(btn){let h=false;padCache.forEach((p,i)=>{if(!p||!p.connected)return;const k=i+':'+btn,now=!!(p.buttons[btn]&&p.buttons[btn].pressed);if(now&&!padPrevBtn[k])h=true;padPrevBtn[k]=now;});return h;}
// face-button positions: 0 bottom, 1 right, 2 left, 3 top (keyboard: down, right, left, up)
function readBtn(id){if(id[0]==='k'){const m=KEYSETS[+id[1]];for(const[k,c]of[[0,m.down],[1,m.right],[2,m.left],[3,m.up]])if(hit.has(c))return k;return -1;}
 const p=padCache[+id[1]];if(!p||!p.connected)return -1;let out=-1;for(let k=0;k<4;k++){const now=!!(p.buttons[k]&&p.buttons[k].pressed),key=id+k;if(now&&!btnPrev[key]&&out<0)out=k;btnPrev[key]=now;}return out;}
function pollDevices(){padCache=pads();for(const id of DEV_IDS){const r=readDev(id);devPressed[id]=r.act&&!(devState[id]&&devState[id].act);devState[id]=r;devBtn[id]=readBtn(id);}}
let click=null;
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();click={x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};cv.focus();});
const inRect=(c,x,y,w,h)=>c&&c.x>x&&c.x<x+w&&c.y>y&&c.y<y+h;

// ---------- players & party state ----------
const players=[0,1,2,3].map(i=>({id:i,color:COLORS[i],name:NAMES[i],dev:null,coins:0,wins:0,coop:0}));
const devName=id=>id[0]==='k'?KEYSETS[+id[1]].name:'Controller '+(+id[1]+1);
const humans=()=>players.filter(p=>p.dev);
const anyHumanPressed=()=>players.some(p=>p.dev&&devPressed[p.dev]);
let S='title',T=0,roundsTotal=6,round=0,lastMode=null,lastGame=null,setup=null,game=null,res=null,soloCount=[0,0,0,0],ready=[false,false,false,false],finalData=null,freePlay=false;
const lib={sel:0,mode:0,cool:0,scroll:0};
const MODES={ffa:{label:'FREE-FOR-ALL',sub:'Every pal for themselves'},'2v2':{label:'2 VS 2',sub:'Team up with a partner'},'1v3':{label:'1 VS 3',sub:'One brave pal against the rest'},coop:{label:'CO-OP',sub:'Everyone works together for coins'}};

function inputs(){
 return players.map(p=>{
  let i;
  if(p.dev){const d=devState[p.dev]||{x:0,y:0,act:false};i={x:d.x,y:d.y,act:d.act,pressed:!!devPressed[p.dev],btn:devBtn[p.dev]??-1};}
  else{const b=(game&&game.bot(p.id))||{};i={x:b.x||0,y:b.y||0,act:!!b.press,pressed:!!b.press,btn:b.btn??-1};}
  const m=Math.hypot(i.x,i.y);if(m>1){i.x/=m;i.y/=m;}
  return i;});
}
const NOIN=[0,1,2,3].map(()=>({x:0,y:0,act:false,pressed:false,btn:-1}));

function makeSetup(mode,G){
 const team=[0,0,0,0];let solo=-1;
 if(mode==='2v2'){const ids=shuffle([0,1,2,3]);team[ids[2]]=1;team[ids[3]]=1;}
 if(mode==='1v3'){const mn=Math.min(...soloCount),c=[0,1,2,3].filter(i=>soloCount[i]===mn);solo=c[ri(c.length)];soloCount[solo]++;for(let i=0;i<4;i++)team[i]=i===solo?0:1;}
 return{mode,G,team,solo};
}
function pickRound(){
 const opts=Object.keys(MODES).filter(m=>m!==lastMode);
 const mode=opts[ri(opts.length)];lastMode=mode;
 const pool=GAMES.filter(G=>G.modes.includes(mode));
 let pick=pool.filter(G=>G!==lastGame);if(!pick.length)pick=pool;
 const G=pick[ri(pick.length)];lastGame=G;setup=makeSetup(mode,G);
}
function resetScores(){players.forEach(p=>{p.coins=0;p.wins=0;p.coop=0;});soloCount=[0,0,0,0];}
function startParty(){freePlay=false;resetScores();round=0;lastMode=null;lastGame=null;nextRound();beep(523,.1);beep(784,.15);}
function nextRound(){round++;pickRound();S='intro';T=0;ready=[false,false,false,false];}
function startGame(){parts.length=0;game=setup.G.create(setup);S='play';T=0;}

function applyAwards(r){
 const d=[0,0,0,0];let head='',winners=[];
 if(r.kind==='rank'){[10,5,3,0].forEach((v,k)=>d[r.order[k]]=v);winners=[r.order[0]];head=NAMES[r.order[0]]+' wins!';}
 else if(r.kind==='team'){
  if(setup.mode==='1v3'){const s=setup.solo;if(r.winners.includes(s)){d[s]=15;head=NAMES[s]+' beat the trio!';winners=[s];}else{for(let i=0;i<4;i++)if(i!==s)d[i]=5;head='The trio wins!';winners=[0,1,2,3].filter(i=>i!==s);}}
  else if(!r.winners.length){d.fill(3);head="It's a draw!";}
  else{r.winners.forEach(i=>d[i]=8);head='Team '+TEAMN[setup.team[r.winners[0]]]+' wins!';winners=r.winners;}
 } else {
  const ok=r.collected>=r.goal,each=Math.round(10*Math.min(1,r.collected/r.goal))+(ok?3:0);d.fill(each);
  r.per.forEach((v,i)=>players[i].coop+=v);
  head=(ok?'Goal reached! ':'So close! ')+r.collected+' / '+r.goal+(r.unit?' '+r.unit:'');if(ok)winners=[0,1,2,3];
 }
 if(r.bonus)r.bonus.forEach((v,i)=>d[i]+=v);
 winners.forEach(i=>players[i].wins++);d.forEach((v,i)=>players[i].coins+=v);
 return{d,head,winners};
}
function buildFinal(){
 const bonus=[];
 const award=(title,why,key)=>{const mx=Math.max(...players.map(p=>p[key]));if(mx<=0)return;const ids=players.filter(p=>p[key]===mx).map(p=>p.id);ids.forEach(i=>players[i].coins+=10);bonus.push({title,why,ids});};
 award('Mini-Game Star','Most mini-games won','wins');
 award('Team Player','Most collected in co-op games','coop');
 finalData={bonus,rank:[...players].sort((a,b)=>b.coins-a.coins||b.wins-a.wins).map(p=>p.id)};
}

// ---------- drawing helpers ----------
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function txt(s,x,y,size,col='#fff',align='center',stroke=true,weight=800){g.font=weight+' '+size+'px '+FONT;g.textAlign=align;g.textBaseline='middle';if(stroke){g.lineJoin='round';g.lineWidth=Math.max(3,size/7);g.strokeStyle='rgba(20,10,40,.85)';g.strokeText(s,x,y);}g.fillStyle=col;g.fillText(s,x,y);}
function wrap(s,x,y,maxW,lh,size,col,weight=600){g.font=weight+' '+size+'px '+FONT;g.fillStyle=col;g.textAlign='center';g.textBaseline='middle';let line='',ly=y;for(const w of s.split(' ')){if(g.measureText(line+w).width>maxW&&line){g.fillText(line.trim(),x,ly);line='';ly+=lh;}line+=w+' ';}g.fillText(line.trim(),x,ly);return ly;}

// The Pal character: bean body, outline, feet, arms, face and a per-player accessory
function blob(x,y,r,col,o={}){
 const idx=COLORS.indexOf(col),seed=(idx+1)*1.7;
 g.save();g.globalAlpha=o.alpha??1;
 g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(x,y+r*.98,r*.95,r*.3,0,0,7);g.fill();
 if(o.ring){g.strokeStyle=o.ring;g.lineWidth=5;g.beginPath();g.ellipse(x,y+r*.98,r*1.15,r*.42,0,0,7);g.stroke();}
 const by=y-(o.bob||0),sq=o.squash||1,bw=r*(2-sq)*.92,bh=r*sq*1.08,mv=o.move?1:0,ph=GT*15+seed;
 g.lineWidth=Math.max(2,r*.09);g.strokeStyle=OUT;g.lineJoin='round';
 for(const s of[-1,1]){const lift=mv?Math.max(0,Math.sin(ph+(s>0?Math.PI:0)))*r*.2:0;g.fillStyle=shade(col,-.35);g.beginPath();g.ellipse(x+s*r*.4,by+bh*.88-lift,r*.27,r*.17,0,0,7);g.fill();g.stroke();}
 for(const s of[-1,1]){const sw=mv?Math.sin(ph+(s>0?0:Math.PI))*r*.14:(o.cheer?-r*.5:0);g.fillStyle=shade(col,-.1);g.beginPath();g.ellipse(x+s*bw*.97,by+r*.12+sw,r*.17,r*.24,s*.5,0,7);g.fill();g.stroke();}
 const gr=g.createRadialGradient(x-bw*.35,by-bh*.45,r*.08,x,by,r*1.35);gr.addColorStop(0,shade(col,.45));gr.addColorStop(.5,col);gr.addColorStop(1,shade(col,-.35));
 g.fillStyle=gr;g.beginPath();g.ellipse(x,by,bw,bh,0,0,7);g.fill();g.stroke();
 g.fillStyle='rgba(255,255,255,.2)';g.beginPath();g.ellipse(x,by+bh*.45,bw*.55,bh*.32,0,0,7);g.fill();
 g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.ellipse(x-bw*.42,by-bh*.5,r*.18,r*.1,-.6,0,7);g.fill();
 const fx=(o.fx||0)*r*.1,fy=(o.fy||0)*r*.08,ey=by-bh*.18,ex=r*.3;
 if(o.dizzy){g.strokeStyle=OUT;g.lineWidth=Math.max(2,r*.1);for(const s of[-1,1]){const cx=x+s*ex+fx;g.beginPath();g.moveTo(cx-r*.13,ey-r*.13);g.lineTo(cx+r*.13,ey+r*.13);g.moveTo(cx+r*.13,ey-r*.13);g.lineTo(cx-r*.13,ey+r*.13);g.stroke();}
  g.beginPath();for(let k=0;k<=6;k++)g.lineTo(x-r*.2+k*r*.067,by+bh*.25+(k%2?3:-1));g.stroke();}
 else{
  const blink=((GT+seed*2.3)%4.2)<.12;
  for(const s of[-1,1]){const cx=x+s*ex+fx*.4;
   if(blink){g.strokeStyle=OUT;g.lineWidth=Math.max(2,r*.08);g.beginPath();g.moveTo(cx-r*.15,ey);g.lineTo(cx+r*.15,ey);g.stroke();continue;}
   g.fillStyle='#fff';g.strokeStyle=OUT;g.lineWidth=Math.max(1.5,r*.06);g.beginPath();g.ellipse(cx,ey,r*.19,r*.25,0,0,7);g.fill();g.stroke();
   g.fillStyle=OUT;g.beginPath();g.ellipse(cx+fx*.7,ey+fy+r*.03,r*.11,r*.14,0,0,7);g.fill();
   g.fillStyle='#fff';g.beginPath();g.arc(cx+fx*.7+r*.04,ey+fy-r*.04,r*.04,0,7);g.fill();}
  g.fillStyle='rgba(255,120,150,.45)';for(const s of[-1,1]){g.beginPath();g.ellipse(x+s*r*.52,by+bh*.12,r*.12,r*.07,0,0,7);g.fill();}
  g.strokeStyle=OUT;g.lineWidth=Math.max(1.5,r*.07);g.lineCap='round';
  if(o.mood==='ouch'){g.fillStyle=OUT;g.beginPath();g.ellipse(x+fx*.5,by+bh*.28,r*.09,r*.12,0,0,7);g.fill();}
  else if(o.cheer||o.mood==='happy'){g.fillStyle='#7a1f3a';g.beginPath();g.arc(x+fx*.5,by+bh*.16,r*.17,0,Math.PI);g.closePath();g.fill();g.stroke();}
  else{g.beginPath();g.arc(x+fx*.5,by+bh*.12,r*.12,.25,Math.PI-.25);g.stroke();}
 }
 // accessory
 const ty=by-bh;g.strokeStyle=OUT;g.lineWidth=Math.max(1.5,r*.07);
 if(idx===0){g.fillStyle='#fff';g.beginPath();g.ellipse(x,ty+bh*.3,bw*.93,r*.13,0,Math.PI*1.05,Math.PI*1.95);g.lineTo(x+bw*.85,ty+bh*.42);g.ellipse(x,ty+bh*.42,bw*.88,r*.12,0,-.1,Math.PI*-.9,true);g.closePath();g.fill();g.stroke();
  const tx=x+bw*.9,tw=Math.sin(GT*8+seed)*r*.08;g.beginPath();g.moveTo(tx,ty+bh*.35);g.lineTo(tx+r*.38,ty+bh*.2+tw);g.lineTo(tx+r*.3,ty+bh*.45+tw);g.closePath();g.fill();g.stroke();}
 else if(idx===1){g.fillStyle='#ffe066';g.beginPath();g.ellipse(x,ty+r*.32,bw*.82,r*.45,0,Math.PI,0);g.closePath();g.fill();g.stroke();
  g.beginPath();g.ellipse(x+bw*.45,ty+r*.32,bw*.5,r*.11,0,0,7);g.fill();g.stroke();g.fillStyle='#ff5a4e';g.beginPath();g.arc(x,ty-r*.12,r*.08,0,7);g.fill();g.stroke();}
 else if(idx===2){const sw=Math.sin(GT*3+seed)*.15;g.strokeStyle='#2a7a3a';g.lineWidth=Math.max(2,r*.08);g.beginPath();g.moveTo(x,ty+2);g.quadraticCurveTo(x+r*.05,ty-r*.3,x+r*.02,ty-r*.38);g.stroke();g.strokeStyle=OUT;g.lineWidth=Math.max(1.5,r*.06);
  for(const s of[-1,1]){g.save();g.translate(x+r*.02,ty-r*.36);g.rotate(s*(.7+sw));g.fillStyle='#8be36b';g.beginPath();g.ellipse(s*r*.2,0,r*.22,r*.1,0,0,7);g.fill();g.stroke();g.restore();}}
 else if(idx===3){g.save();g.translate(x+bw*.45,ty+bh*.12);g.rotate(.3);g.fillStyle='#ff7ab6';for(const s of[-1,1]){g.beginPath();g.moveTo(0,0);g.lineTo(s*r*.38,-r*.2);g.lineTo(s*r*.38,r*.2);g.closePath();g.fill();g.stroke();}g.beginPath();g.arc(0,0,r*.1,0,7);g.fill();g.stroke();g.restore();}
 if(o.crown){g.fillStyle='#ffd23c';g.strokeStyle='#8a5a00';g.lineWidth=2;const cy=ty-(idx===2?r*.35:2);g.beginPath();g.moveTo(x-r*.45,cy);g.lineTo(x-r*.45,cy-r*.35);g.lineTo(x-r*.22,cy-r*.15);g.lineTo(x,cy-r*.42);g.lineTo(x+r*.22,cy-r*.15);g.lineTo(x+r*.45,cy-r*.35);g.lineTo(x+r*.45,cy);g.closePath();g.fill();g.stroke();}
 g.restore();
 if(o.tag)txt(o.tag,x,by-bh-r*(o.crown?.95:.6)-(idx===2?r*.35:0),15,col);
}
const tagOf=id=>players[id].dev?'P'+(id+1):'CPU';
function hud(name,left,extra){
 g.fillStyle='rgba(15,8,32,.6)';rr(20,14,W-40,56,18);g.fill();g.strokeStyle='rgba(255,255,255,.12)';g.lineWidth=2;rr(20,14,W-40,56,18);g.stroke();
 txt(name,44,42,28,'#fff','left');
 if(left!=null){g.fillStyle=left<=5?'#ff6b6b':'#ffe066';rr(W/2-48,20,96,44,22);g.fill();txt(Math.max(0,Math.ceil(left)).toString(),W/2,42,32,'#2a1650',undefined,false);}
 if(extra)txt(extra,W-44,42,22,'#fff','right');
}
function countdown(t){
 if(t<2.4){const n=3-Math.floor(t/0.8),s=1+(1-(t%.8)/.8)*.4;g.fillStyle='rgba(10,5,25,.35)';g.fillRect(0,0,W,H);g.save();g.translate(W/2,H/2);g.scale(s,s);txt(String(n),0,0,140,'#ffe066');g.restore();}
 else if(t<3.1)txt('GO!',W/2,H/2,150,'#7dff9a');
}
function bg(top,bot){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,top);gr.addColorStop(1,bot);g.fillStyle=gr;g.fillRect(0,0,W,H);}

// ---- Melting Floe (FFA, 2v2) ----
const Floe={name:'Melting Floe',modes:['ffa','2v2'],
 desc:m=>(m==='2v2'?'Bump the other team into the sea. Last team with anyone on the ice wins!':'Bump everyone into the sea before the ice melts. Last pal standing wins!')+' Grab the coins that pop up on the ice. You keep every one!',
 how:'Move to slide on the ice · Action: dash-bump',
 create(st){
  const cx=640,cy=405,ps=[0,1,2,3].map(i=>{const a=-Math.PI*3/4+i*Math.PI/2;return{id:i,x:cx+Math.cos(a)*165,y:cy+Math.sin(a)*165,vx:0,vy:0,cd:0,dash:0,out:false,fall:0,fx:0,fy:1,hurt:0};});
  const elim=[],coins=[],got=[0,0,0,0];let coinT=1;
  const o={t:0,R:290,dur:45,done:false,result:null,
   update(dt,inp){
    o.t+=dt;o.R=Math.max(95,290-o.t*5.5);
    coinT-=dt;if(coinT<=0&&coins.length<4){coinT=rnd(.8,1.6);const a=rnd(0,7),d=Math.sqrt(Math.random())*(o.R-30);coins.push({x:cx+Math.cos(a)*d,y:cy+Math.sin(a)*d,t:0,big:Math.random()<.15});}
    for(let k=coins.length-1;k>=0;k--){const c=coins[k];c.t+=dt;if(Math.hypot(c.x-cx,c.y-cy)>o.R-6){coins.splice(k,1);burst(c.x,c.y,['#ffcf33','#bfe7ff'],6,120);continue;}
     for(const p of ps)if(!p.out&&Math.hypot(p.x-c.x,p.y-c.y)<40){got[p.id]+=c.big?3:1;p.glad=.35;coins.splice(k,1);beep(c.big?1200:900,.06,'sine');burst(c.x,c.y,['#ffcf33','#fff3a0'],10,180);break;}}
    for(const p of ps){
     if(p.out){p.fall+=dt;continue;}
     const i=inp[p.id];p.vx+=i.x*900*dt;p.vy+=i.y*900*dt;if(i.x||i.y){p.fx=i.x;p.fy=i.y;}
     p.cd-=dt;p.dash-=dt;p.hurt-=dt;p.glad=(p.glad||0)-dt;
     if(i.pressed&&p.cd<=0){const m=Math.hypot(p.fx,p.fy)||1;p.vx+=p.fx/m*520;p.vy+=p.fy/m*520;p.cd=1.1;p.dash=.3;beep(240,.06);burst(p.x,p.y+20,'#ffffff',6,120);}
     const f=Math.pow(.35,dt);p.vx*=f;p.vy*=f;
     const sp=Math.hypot(p.vx,p.vy),mx=p.dash>0?720:330;if(sp>mx){p.vx*=mx/sp;p.vy*=mx/sp;}
     p.x+=p.vx*dt;p.y+=p.vy*dt;
    }
    for(let a=0;a<4;a++)for(let b=a+1;b<4;b++){const A=ps[a],B=ps[b];if(A.out||B.out)continue;
     const dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy);if(d>=52||d===0)continue;
     const nx=dx/d,ny=dy/d,ov=(52-d)/2;A.x-=nx*ov;A.y-=ny*ov;B.x+=nx*ov;B.y+=ny*ov;
     const rel=(A.vx-B.vx)*nx+(A.vy-B.vy)*ny;
     if(rel>0){const j=rel*.9,kA=B.dash>0?1.8:1,kB=A.dash>0?1.8:1;A.vx-=nx*j*kA;A.vy-=ny*j*kA;B.vx+=nx*j*kB;B.vy+=ny*j*kB;if(rel>200){beep(150,.05,'triangle');burst((A.x+B.x)/2,(A.y+B.y)/2,'#fff6a0',8,200);kick(5);A.hurt=B.hurt=.3;}}}
    for(const p of ps)if(!p.out&&Math.hypot(p.x-cx,p.y-cy)>o.R+12){p.out=true;elim.push(p.id);beep(300,.25,'sine');burst(p.x,p.y+10,['#bfe7ff','#ffffff','#6fb7ff'],16,260);}
    const alive=ps.filter(p=>!p.out),teams=new Set(alive.map(p=>st.team[p.id]));
    const over=st.mode==='2v2'?teams.size<=1:alive.length<=1;
    if(over||o.t>=o.dur){
     const order=alive.sort((a,b)=>Math.hypot(a.x-cx,a.y-cy)-Math.hypot(b.x-cx,b.y-cy)).map(p=>p.id).concat([...elim].reverse());
     if(st.mode==='ffa')o.result={kind:'rank',order,bonus:[...got]};
     else{const c=[0,0];alive.forEach(p=>c[st.team[p.id]]++);const w=c[0]===c[1]?-1:(c[0]>c[1]?0:1);o.result={kind:'team',winners:w<0?[]:[0,1,2,3].filter(i=>st.team[i]===w),bonus:[...got]};}
     o.done=true;}
   },
   bot(id){const p=ps[id];if(p.out)return null;const d=Math.hypot(p.x-cx,p.y-cy)||1;
    for(const c of coins)if(Math.hypot(c.x-p.x,c.y-p.y)<160&&Math.hypot(c.x-cx,c.y-cy)<o.R*.75){const cd=Math.hypot(c.x-p.x,c.y-p.y)||1;return{x:(c.x-p.x)/cd,y:(c.y-p.y)/cd};}
    if(d>o.R*.55)return{x:(cx-p.x)/d,y:(cy-p.y)/d};
    let best=null,bd=1e9;for(const q of ps){if(q===p||q.out||(st.mode==='2v2'&&st.team[q.id]===st.team[id]))continue;const dd=Math.hypot(q.x-p.x,q.y-p.y);if(dd<bd){bd=dd;best=q;}}
    if(!best)return{x:(cx-p.x)/d*.3,y:(cy-p.y)/d*.3};
    return{x:(best.x-p.x)/bd,y:(best.y-p.y)/bd,press:bd<140&&p.cd<=0&&Math.random()<.07};},
   draw(){
    bg('#2a8fd6','#0b3a6e');
    g.strokeStyle='rgba(255,255,255,.13)';g.lineWidth=3;for(let i=0;i<9;i++){g.beginPath();for(let x=0;x<=W;x+=20)g.lineTo(x,90+i*75+Math.sin(x/60+o.t*2+i)*8);g.stroke();}
    g.fillStyle='#7fc4ec';g.beginPath();g.ellipse(cx,cy+22,o.R+4,o.R,0,0,7);g.fill();
    g.fillStyle='#a8dcf7';g.beginPath();g.ellipse(cx,cy+12,o.R,o.R,0,0,7);g.fill();
    const gr=g.createRadialGradient(cx-o.R*.3,cy-o.R*.3,10,cx,cy,o.R);gr.addColorStop(0,'#ffffff');gr.addColorStop(1,'#d4f0ff');g.fillStyle=gr;g.beginPath();g.arc(cx,cy,o.R,0,7);g.fill();
    g.strokeStyle='rgba(120,180,220,.6)';g.lineWidth=2;for(let i=0;i<6;i++){const a=i*1.05+.3;g.beginPath();g.moveTo(cx+Math.cos(a)*o.R*.3,cy+Math.sin(a)*o.R*.3);g.lineTo(cx+Math.cos(a+.15)*o.R*.95,cy+Math.sin(a+.15)*o.R*.95);g.stroke();}
    g.fillStyle='rgba(255,255,255,.7)';for(let i=0;i<5;i++){const a=i*1.3+o.t*.1;g.beginPath();g.ellipse(cx+Math.cos(a)*o.R*.6,cy+Math.sin(a)*o.R*.6,14,5,a,0,7);g.fill();}
    for(const c of coins){const sc=Math.min(1,c.t*5),r=(c.big?20:14)*sc,w=Math.abs(Math.cos(o.t*5+c.x)),by=c.y-10-Math.abs(Math.sin(o.t*4+c.y))*6;g.fillStyle='rgba(0,0,0,.15)';g.beginPath();g.ellipse(c.x,c.y+6,r,r*.35,0,0,7);g.fill();g.fillStyle='#ffcf33';g.strokeStyle='#b07800';g.lineWidth=3;g.beginPath();g.ellipse(c.x,by,r*Math.max(.25,w),r,0,0,7);g.fill();g.stroke();if(c.big){g.fillStyle='#fff3a0';g.beginPath();g.ellipse(c.x,by,r*.4*Math.max(.25,w),r*.4,0,0,7);g.fill();}}
    for(const p of [...ps].sort((a,b)=>a.y-b.y)){
     if(p.out){if(p.fall<.7){const s=1-p.fall/.7;blob(p.x,p.y+p.fall*40,26*s,COLORS[p.id],{alpha:s,dizzy:true});}continue;}
     blob(p.x,p.y,26,COLORS[p.id],{fx:p.fx,fy:p.fy,tag:tagOf(p.id)+' · '+got[p.id],ring:st.mode==='2v2'?TEAMC[st.team[p.id]]:null,squash:p.dash>0?.85:1,move:Math.hypot(p.vx,p.vy)>60,mood:p.hurt>0?'ouch':p.glad>0?'happy':null});}
    drawParts();hud(Floe.name,o.dur-o.t,ps.filter(p=>!p.out).length+' left');
   }};
  return o;}};

// ---- Quick Draw (FFA, 2v2): press the exact button shown ----
const BTN_L=['B','A','Y','X'],BTN_ARROW=['↓','→','←','↑'],BTN_C=['#ffc93c','#ff5a4e','#3ccf6e','#4e8dff'];
function drawPad(x,y,sz,hi,alpha=1){g.save();g.globalAlpha=alpha;const pos=[[0,1],[1,0],[-1,0],[0,-1]];
 for(let k=0;k<4;k++){const[dx,dy]=pos[k],on=k===hi,r=on?sz*.62:sz*.4;g.fillStyle=on?BTN_C[k]:'rgba(60,40,90,.25)';g.strokeStyle=OUT;g.lineWidth=on?6:3;g.beginPath();g.arc(x+dx*sz,y+dy*sz,r,0,7);g.fill();g.stroke();
  if(on)txt(BTN_L[k],x+dx*sz,y+dy*sz+3,sz*.8,'#fff');}g.restore();}
const Draw={name:'Quick Draw',modes:['ffa','2v2'],
 desc:m=>'Three rounds. A button lights up on the sign. Press exactly that button as fast as you can!'+(m==='2v2'?' Fastest team total wins.':' Fastest total time wins.'),
 how:'Controllers: the face button shown (A, B, X or Y) · Keyboard: the matching direction key · Early or wrong = +1.5s',
 create(st){
  const o={t:0,done:false,result:null,rounds:3,ri:0,phase:'wait',pt:0,times:[0,0,0,0],rt:[],fs:[],why:[],botRT:[],botFS:[],nextSig:0,decoyAt:-1,target:0,decoyBtn:0};
  function newRound(){o.phase='wait';o.pt=0;o.nextSig=rnd(2,4.5);o.decoyAt=Math.random()<.6?rnd(.8,o.nextSig-.7):-1;o.target=ri(4);o.decoyBtn=ri(4);o.rt=[null,null,null,null];o.fs=[false,false,false,false];o.why=['','','',''];o.botRT=[0,1,2,3].map(()=>rnd(.28,.55));o.botFS=[0,1,2,3].map(()=>o.decoyAt>=0&&Math.random()<.12);}
  newRound();
  const decoyOn=()=>o.phase==='wait'&&o.decoyAt>=0&&o.pt>=o.decoyAt&&o.pt<o.decoyAt+.55;
  const fail=(i,why)=>{o.rt[i]=1.5;o.fs[i]=true;o.why[i]=why;beep(110,.2,'sawtooth');};
  Object.assign(o,{
   update(dt,inp){o.t+=dt;o.pt+=dt;
    if(o.phase==='wait'){for(let i=0;i<4;i++)if(inp[i].btn>=0&&o.rt[i]==null)fail(i,decoyOn()?'DECOY!':'TOO EARLY!');
     if(o.pt>=o.nextSig){o.phase='go';o.pt=0;beep(880,.15);kick(6);}}
    else if(o.phase==='go'){for(let i=0;i<4;i++)if(inp[i].btn>=0&&o.rt[i]==null){if(inp[i].btn===o.target){o.rt[i]=o.pt;beep(660,.05);burst(260+i*253,500,COLORS[i],10,200);}else fail(i,'WRONG BUTTON!');}
     if(o.rt.every(v=>v!=null)||o.pt>1.8){o.rt=o.rt.map(v=>v==null?1.5:v);o.rt.forEach((v,i)=>o.times[i]+=v);o.phase='show';o.pt=0;o.ri++;}}
    else if(o.pt>1.8){if(o.ri<o.rounds)newRound();else{
     if(st.mode==='ffa')o.result={kind:'rank',order:[0,1,2,3].sort((a,b)=>o.times[a]-o.times[b])};
     else{const s2=[0,0];o.times.forEach((v,i)=>s2[st.team[i]]+=v);const w=Math.abs(s2[0]-s2[1])<.001?-1:(s2[0]<s2[1]?0:1);o.result={kind:'team',winners:w<0?[]:[0,1,2,3].filter(i=>st.team[i]===w)};}
     o.done=true;}}
   },
   bot(id){if(o.rt[id]!=null)return null;
    if(o.phase==='go'&&o.pt>=o.botRT[id])return{btn:Math.random()<.06?(o.target+1)%4:o.target};
    if(o.botFS[id]&&decoyOn()&&o.pt>o.decoyAt+.25)return{btn:o.decoyBtn};return null;},
   draw(){
    bg('#ff9a5a','#7a2e6e');g.fillStyle='#ffd27a';g.beginPath();g.arc(W/2,470,170,Math.PI,0);g.fill();
    g.fillStyle='#8a3d6a';for(let i=0;i<7;i++){g.beginPath();g.moveTo(i*220-60,470);g.lineTo(i*220+60,390-(i%3)*30);g.lineTo(i*220+180,470);g.fill();}
    g.fillStyle='#4a1f4f';g.fillRect(0,470,W,250);
    const sx=W/2,sy=240;
    g.fillStyle='#7a4a2a';g.fillRect(sx-8,sy+110,16,130);g.fillStyle='#f4e1c1';g.strokeStyle=OUT;g.lineWidth=5;rr(sx-160,sy-135,320,265,26);g.fill();g.stroke();
    const live=o.phase==='go'||(o.phase==='show'&&o.pt<.8);
    if(live){drawPad(sx,sy-15,62,o.target);txt('PRESS '+BTN_L[o.target]+'   ·   keyboard '+BTN_ARROW[o.target],sx,sy+105,20,'#2a1650',undefined,false);}
    else if(decoyOn()){drawPad(sx,sy-15,62,o.decoyBtn,.4);g.strokeStyle='#4e8dff';g.lineWidth=10;g.lineCap='round';g.beginPath();g.moveTo(sx-95,sy-105);g.lineTo(sx+95,sy+70);g.stroke();txt('DECOY — DON’T PRESS!',sx,sy+105,20,'#2f6fd6',undefined,false);}
    else if(o.phase==='wait'){drawPad(sx,sy-15,62,-1);txt('Wait for it…',sx,sy+105,24,'#2a1650',undefined,false);}
    else drawPad(sx,sy-15,62,o.target,.5);
    for(let i=0;i<4;i++){const x=260+i*253,y=575,shake=o.phase==='wait'?Math.sin(o.t*30+i)*1.2:0,good=o.rt[i]!=null&&!o.fs[i];
     blob(x+shake,y,38,COLORS[i],{tag:tagOf(i),ring:st.mode==='2v2'?TEAMC[st.team[i]]:null,dizzy:o.fs[i],squash:good?.88:1,cheer:good&&o.phase!=='wait',fy:-1});
     if(o.fs[i])txt(o.why[i]+' +1.5',x,y+70,20,'#ff6b6b');
     else if(o.rt[i]!=null&&o.phase!=='wait')txt(o.rt[i]>=1.5?'too slow':o.rt[i].toFixed(3)+'s',x,y+70,26,'#fff');
     txt('Total '+o.times[i].toFixed(2)+'s',x,y+104,18,'#e6d6ff');}
    drawParts();hud(Draw.name,null,'Round '+Math.min(o.ri+1,o.rounds)+' / '+o.rounds);
   }});
  return o;}};

// ---- Gem Grab (2v2, co-op) ----
const Gems={name:'Gem Grab',modes:['2v2','coop'],
 desc:m=>(m==='coop'?'Grab gems together! Reach the team goal before time runs out. Gold gems are worth 3.':'Grab more gems than the other team. Gold gems are worth 3. Dash into rivals to stun them!')+' Watch out for the bouncy bumpers!',
 how:'Move to run · Action: dash (stuns rivals in 2 vs 2)',
 create(st){
  const coop=st.mode==='coop',goal=90,dur=30;
  const ps=[[200,280],[1080,280],[200,560],[1080,560]].map(([x,y],i)=>({id:i,x,y,vx:0,vy:0,fx:0,fy:1,cd:0,dash:0,stun:0,glad:0}));
  const gems=[],per=[0,0,0,0];let spawnT=0;
  const bumps=[[640,410],[400,250],[880,250],[400,580],[880,580],[180,420],[1100,420]].map(([x,y])=>({x,y,r:34,hit:0}));
  const spawn=()=>{let q;for(let k=0;k<20;k++){q={x:rnd(110,1170),y:rnd(150,670),gold:Math.random()<.12,t:0};if(bumps.every(b=>Math.hypot(b.x-q.x,b.y-q.y)>b.r+40))break;}gems.push(q);};
  for(let i=0;i<5;i++)spawn();
  const o={t:0,dur,done:false,result:null,
   update(dt,inp){o.t+=dt;spawnT-=dt;if(gems.length<5&&spawnT<=0){spawn();spawnT=.35;}gems.forEach(q=>q.t+=dt);bumps.forEach(b=>b.hit-=dt);
    for(const p of ps){const i=inp[p.id];p.cd-=dt;p.dash-=dt;p.stun-=dt;p.glad-=dt;
     if(p.stun<=0){if(i.x||i.y){p.fx=i.x;p.fy=i.y;}const k=Math.min(1,dt*10);if(p.dash<=0){p.vx+=(i.x*300-p.vx)*k;p.vy+=(i.y*300-p.vy)*k;}
      if(i.pressed&&p.cd<=0){const m=Math.hypot(p.fx,p.fy)||1;p.vx=p.fx/m*680;p.vy=p.fy/m*680;p.dash=.22;p.cd=1;beep(260,.05);}}
     else{p.vx*=Math.pow(.05,dt);p.vy*=Math.pow(.05,dt);}
     p.x=clamp(p.x+p.vx*dt,50,1230);p.y=clamp(p.y+p.vy*dt,130,690);
     for(const b of bumps){const dx=p.x-b.x,dy=p.y-b.y,d=Math.hypot(dx,dy);if(d<b.r+24&&d>0){const nx=dx/d,ny=dy/d;p.x=b.x+nx*(b.r+24);p.y=b.y+ny*(b.r+24);p.vx=nx*620;p.vy=ny*620;p.stun=Math.max(p.stun,.3);p.dash=0;b.hit=.2;beep(400,.06,'square',.03);burst(p.x-nx*20,p.y-ny*20,['#ffd23c','#ff7a3c'],8,200);kick(3);}}
     for(let k=gems.length-1;k>=0;k--){const q=gems[k];if(Math.hypot(q.x-p.x,q.y-p.y)<44){per[p.id]+=q.gold?3:1;gems.splice(k,1);p.glad=.4;beep(q.gold?1046:784,.07,'sine');burst(q.x,q.y,q.gold?['#ffd23c','#fff3a0']:['#59e3ff','#c6f6ff'],10,200);}}}
    for(let a=0;a<4;a++)for(let b=a+1;b<4;b++){const A=ps[a],B=ps[b],dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy);if(d>=50||d===0)continue;
     const nx=dx/d,ny=dy/d,ov=(50-d)/2;A.x-=nx*ov;A.y-=ny*ov;B.x+=nx*ov;B.y+=ny*ov;
     if(!coop&&st.team[A.id]!==st.team[B.id]){const hitp=(P,sx,sy)=>{P.stun=1;P.vx=sx*400;P.vy=sy*400;beep(140,.12,'triangle');burst(P.x,P.y-20,'#fff6a0',10,220);kick(5);};
      if(A.dash>0&&B.stun<=0)hitp(B,nx,ny);if(B.dash>0&&A.stun<=0)hitp(A,-nx,-ny);}}
    if(o.t>=dur){const tot=per.reduce((a,b)=>a+b,0);
     if(coop)o.result={kind:'coop',collected:tot,goal,per:[...per],unit:'gems'};
     else{const s=[0,0];per.forEach((v,i)=>s[st.team[i]]+=v);const w=s[0]===s[1]?-1:(s[0]>s[1]?0:1);o.result={kind:'team',winners:w<0?[]:[0,1,2,3].filter(i=>st.team[i]===w)};}
     o.done=true;}
   },
   bot(id){const p=ps[id];if(p.stun>0)return null;let best=null,bd=1e9;
    for(const q of gems){const d=Math.hypot(q.x-p.x,q.y-p.y)-(q.gold?120:0);const mateCloser=ps.some(m=>m!==p&&(coop||st.team[m.id]===st.team[id])&&Math.hypot(q.x-m.x,q.y-m.y)<d-20);const sc=d+(mateCloser?260:0);if(sc<bd){bd=sc;best=q;}}

// ---- Race engine: scrolling obstacle courses (Obstacle Dash, Boulder Hill) ----
const X0=250,X1=1030,MID=(X0+X1)/2;
function segPits(y,out,rows=2){for(let k=0;k<rows;k++){const ry=y-60-k*170,gw=rnd(120,150),n=1+ri(2)+(rows<2?1:0),gaps=[];
  for(let j=0;j<n;j++){let a,ok=false;for(let tries=0;tries<20&&!ok;tries++){a=rnd(X0+30,X1-30-gw);ok=gaps.every(([b,c])=>a>c+80||a+gw<b-80);}if(ok)gaps.push([a,a+gw]);}
  out.push({type:'pit',y:ry-80,h:80,gaps});}}
function segSweep(y,out){out.push({type:'sweep',x:X0+210,y:y-90,len:175,a0:rnd(0,6),spd:rnd(1.6,2.2)});out.push({type:'sweep',x:X1-210,y:y-250,len:175,a0:rnd(0,6),spd:-rnd(1.6,2.2)});}
function segSlide(y,out){for(let k=0;k<3;k++)out.push({type:'slide',y:y-40-k*110,w:210,h:44,amp:260,spd:rnd(1.4,2.2),ph:rnd(0,6)});}
function segBump(y,out,n=7){const placed=[];for(let k=0;k<n*4&&placed.length<n;k++){const b={type:'bump',x:rnd(X0+50,X1-50),y:rnd(y-300,y-30),r:30,hit:0};if(placed.every(q=>Math.hypot(q.x-b.x,q.y-b.y)>120)){placed.push(b);out.push(b);}}}
function segBelt(y,out){out.push({type:'belt',x0:X0,x1:X1,y0:y-320,y1:y-20,v:120});segBump(y,out,3);}
function makeRace(def){
 return{name:def.name,modes:def.modes,desc:def.desc,how:'Move to run · Action: dive forward (dive across gaps!)',
 create(st){
  const L=def.length,obs=[];let y=-280;while(y>-L+300){def.segs[ri(def.segs.length)](y,obs);y-=420;}
  const cps=[];for(let c=-420;c>-L;c-=420)cps.push(c);
  const ps=[0,1,2,3].map(i=>({id:i,x:MID-240+i*160,y:60,vx:0,vy:0,fx:0,fy:-1,cd:0,dash:0,stun:0,fall:0,cp:60,cpx:MID-240+i*160,fin:false,off:0,tt:0}));
  const boulders=[],order=[],coop=st.mode==='coop';let bt=1,cam=60-560;
  const pitAt=(x,yy)=>obs.some(ob=>ob.type==='pit'&&yy>ob.y&&yy<ob.y+ob.h&&!ob.gaps.some(([a,b])=>x>a+4&&x<b-4));
  const safeX=(yy,pref)=>{const c=[pref];for(let k=0;k<16;k++)c.push(X0+40+k*(X1-X0-80)/15);c.sort((a,b)=>Math.abs(a-pref)-Math.abs(b-pref));return c.find(x=>!pitAt(x,yy)&&!pitAt(x,yy-30)&&!pitAt(x,yy+30))??MID;};
  const sx=ob=>MID+Math.sin(o.t*ob.spd+ob.ph)*ob.amp;
  const hitP=(p,vx,vy,st2)=>{p.vx=vx;p.vy=vy;p.stun=st2;beep(150,.08,'triangle');burst(p.x,p.y-10,'#fff6a0',8,200);kick(4);};
  const o={t:0,dur:coop&&def.coopDur?def.coopDur:def.dur,done:false,result:null,
   update(dt,inp){o.t+=dt;
    for(const ob of obs)if(ob.type==='bump')ob.hit-=dt;
    for(const p of ps){

   },
   bot(id){const p=ps[id];if(p.out||p.fin)return null;p.tt-=1/60;

     for(const l of plats){if(l.gone||l.floor)continue;const dy=p.y-l.y;if(dy<60||dy>170)continue;if(l.fake&&Math.random()>.1)continue;const sc=Math.abs(l.x-p.x)-(l.goal?500:0);if(sc<bs){bs=sc;best=l;}}

     g.strokeStyle=l.fake?'#8a6a2a':'#2f8a3a';g.lineWidth=2.5;g.beginPath();g.moveTo(-l.w/2+10,0);g.lineTo(l.w/2-10,0);for(let k=-2;k<=2;k++){g.moveTo(k*20,0);g.lineTo(k*20+12,-9);g.moveTo(k*20,0);g.lineTo(k*20+12,9);}g.stroke();

const wrapA=a=>((a+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
function dirOf(i){return Math.abs(i.x)>.6||Math.abs(i.y)>.6?(Math.abs(i.x)>Math.abs(i.y)?(i.x>0?1:2):(i.y>0?0:3)):-1;}
function makeDirEdge(){const prev=[-1,-1,-1,-1];return(i,id)=>{const d=dirOf(i),e=d>=0&&d!==prev[id]?d:-1;prev[id]=d;return e;};}
const DIR_ROT=[Math.PI,Math.PI/2,-Math.PI/2,0],DIR_V=[[0,1],[1,0],[-1,0],[0,-1]],OPP=[3,2,1,0];
function arrow(x,y,dir,s,col,alpha=1){g.save();g.globalAlpha=alpha;g.translate(x,y);g.rotate(DIR_ROT[dir]);g.fillStyle=col;g.strokeStyle=OUT;g.lineWidth=Math.max(3,s*.12);g.lineJoin='round';g.beginPath();g.moveTo(0,-s);g.lineTo(s*.9,0);g.lineTo(s*.38,0);g.lineTo(s*.38,s*.85);g.lineTo(-s*.38,s*.85);g.lineTo(-s*.38,0);g.lineTo(-s*.9,0);g.closePath();g.fill();g.stroke();g.restore();}
function standingResult(st,alive,elim){const order=alive.concat([...elim].reverse());
 if(st.mode==='ffa')return{kind:'rank',order};
 const c=[0,0];alive.forEach(id=>c[st.team[id]]++);let w=c[0]===c[1]?-1:(c[0]>c[1]?0:1);
 if(w<0&&!alive.length&&elim.length)w=st.team[elim[elim.length-1]];
 return{kind:'team',winners:w<0?[]:[0,1,2,3].filter(i=>st.team[i]===w)};}
const overFor=(st,alive)=>st.mode==='2v2'?new Set(alive.map(i=>st.team[i])).size<=1:alive.length<=1;
function topMove(p,i,sp,dt){const k=Math.min(1,dt*10);if(p.dash>0)return;p.vx+=(i.x*sp-p.vx)*k;p.vy+=(i.y*sp-p.vy)*k;}
function pushApart(ps,rad,shove){for(let a=0;a<ps.length;a++)for(let b=a+1;b<ps.length;b++){const A=ps[a],B=ps[b];if(A.out||B.out)continue;const dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy);if(d>=rad||d===0)continue;const nx=dx/d,ny=dy/d,ov=(rad-d)/2;A.x-=nx*ov;A.y-=ny*ov;B.x+=nx*ov;B.y+=ny*ov;
 if(shove){if(A.dash>0&&B.stun<=0){B.vx=nx*480;B.vy=ny*480;B.stun=.4;burst(B.x,B.y-20,'#fff6a0',8,200);beep(150,.08,'triangle');kick(4);}if(B.dash>0&&A.stun<=0){A.vx=-nx*480;A.vy=-ny*480;A.stun=.4;burst(A.x,A.y-20,'#fff6a0',8,200);beep(150,.08,'triangle');kick(4);}}}}
function dashCtl(p,i,dt,sp=620){p.cd-=dt;p.dash-=dt;p.stun-=dt;if(i.x||i.y){p.fx=i.x;p.fy=i.y;}if(p.stun<=0&&i.pressed&&p.cd<=0){const m=Math.hypot(p.fx,p.fy)||1;p.vx=p.fx/m*sp;p.vy=p.fy/m*sp;p.dash=.22;p.cd=1.1;beep(260,.05);}}
const mkP=(xy)=>xy.map(([x,y],i)=>({id:i,x,y,vx:0,vy:0,fx:0,fy:1,cd:0,dash:0,stun:0,out:false,ot:0}));

const Simon={name:'Simon Stomp',modes:['ffa','coop'],

  const endRound=()=>{o.phase='next';o.pt=0;
   if(coop){if(o.lives>0){o.best=o.seq.length;for(let i=0;i<4;i++)if(!o.slip[i])o.good[i]++;}if(o.lives<=0||o.best>=goal)finish();}
   else{alive().forEach(i=>o.good[i]++);if(overFor(st,alive())||o.seq.length>=30)finish();}};

function scoreResult(st,sc,higher=true){const ids=[0,1,2,3];
 if(st.mode==='2v2'){const s=[0,0];ids.forEach(i=>s[st.team[i]]+=sc[i]);const w=Math.abs(s[0]-s[1])<1e-9?-1:((higher?s[0]>s[1]:s[0]<s[1])?0:1);return{kind:'team',winners:w<0?[]:ids.filter(i=>st.team[i]===w)};}
 return{kind:'rank',order:ids.sort((a,b)=>higher?sc[b]-sc[a]:sc[a]-sc[b])};}
function checker(c1,c2,s=80,y0=100){g.fillStyle=c1;g.fillRect(0,0,W,H);g.fillStyle=c2;for(let i=0,x=0;x<W;x+=s,i++)for(let j=0,y=y0;y<H;y+=s,j++)if((i+j)%2===0)g.fillRect(x,y,s,s);}
function stepTop(p,i,dt,sp=290,b=[50,130,1230,690],dashOn=true){if(dashOn)dashCtl(p,i,dt);else{p.stun-=dt;p.cd-=dt;if(i.x||i.y){p.fx=i.x;p.fy=i.y;}}
 if(p.stun<=0)topMove(p,i,sp,dt);else{p.vx*=Math.pow(.05,dt);p.vy*=Math.pow(.05,dt);}
 p.x=clamp(p.x+p.vx*dt,b[0],b[2]);p.y=clamp(p.y+p.vy*dt,b[1],b[3]);}
function palTop(p,st,extra={}){blob(p.x,p.y,extra.r||24,COLORS[p.id],Object.assign({fx:p.fx,fy:p.fy,move:Math.hypot(p.vx,p.vy)>40,dizzy:p.stun>0,squash:p.dash>0?.85:1,tag:tagOf(p.id),ring:st.mode==='2v2'?TEAMC[st.team[p.id]]:null},extra));}
const seek=(p,x,y,s=10)=>{const dx=x-p.x,dy=y-p.y,d=Math.hypot(dx,dy);return d<s?{x:0,y:0}:{x:dx/d,y:dy/d};};
const corners=()=>mkP([[220,260],[1060,260],[220,580],[1060,580]]);
function shoveBot(p,ps,st,rad=100,chance=.05){if(p.cd>0)return false;for(const q of ps)if(q!==p&&!q.out&&(st.mode!=='2v2'||st.team[q.id]!==st.team[p.id])&&(st.mode!=='1v3'||true)&&Math.hypot(q.x-p.x,q.y-p.y)<rad&&Math.random()<chance){p.fx=q.x-p.x;p.fy=q.y-p.y;return true;}return false;}

     s.x+=s.vx*dt;s.y+=s.vy*dt;if(s.x<40||s.x>1240)s.vx*=-1;if(s.y<110||s.y>695)s.vy*=-1;s.x=clamp(s.x,40,1240);s.y=clamp(s.y,110,695);

const Snake={name:'Snake Trails',modes:['ffa','2v2'],
 desc:m=>'You leave a solid trail wherever you go, and you can never stop moving! Steer clear of the walls and every trail. It gets faster as it goes. '+(m==='2v2'?'Last team still moving wins.':'Last pal still moving wins!'),
 how:'Directions: turn (you cannot reverse)',
 create(st){const C=40,R=22,S=28,ox=(W-C*S)/2,oy=98,occ=new Array(C*R).fill(-1),elim=[];let stepT=.6;
  const P=[[6,5,1],[33,5,2],[6,16,1],[33,16,2]].map(([c,r,d],i)=>({id:i,c,r,d,nd:d,out:false,ot:0,trail:[[c,r]]}));P.forEach(p=>occ[p.r*C+p.c]=p.id);

  const space=(c,r)=>{if(!free(c,r))return 0;const seen=new Set([r*C+c]),q=[[c,r]];let n=0;while(q.length&&n<260){const[a,b]=q.shift();n++;for(const[dx,dy]of DIR_V){const x=a+dx,y=b+dy,k=y*C+x;if(free(x,y)&&!seen.has(k)){seen.add(k);q.push([x,y]);}}}return n;};

   for(const d of cand){const nc=p.c+DIR_V[d][0],nr=p.r+DIR_V[d][1];let s=space(nc,nr)+(d===p.d?3:0)+Math.random()*4;for(const q of P)if(q!==p&&!q.out&&Math.abs(q.c-nc)+Math.abs(q.r-nr)<=1)s-=30;if(s>bs){bs=s;best=d;}}return best;};
  const o={t:0,done:false,result:null,
   update(dt,inp){o.t+=dt;

function update(dt){
 T+=dt;shake=Math.max(0,shake-dt*30);stepParts(dt);
 if(S==='title'){
  for(const id of DEV_IDS)if(devPressed[id]&&!players.some(p=>p.dev===id)){const free=players.find(p=>!p.dev);if(free){free.dev=id;beep(600+free.id*100,.08);}}
  if(kp('Backspace'))players.forEach(p=>p.dev=null);
  const cycle=()=>{const R=[3,6,10,15,20];roundsTotal=R[(R.indexOf(roundsTotal)+1)%R.length];beep(400,.05);};
  if(kp('KeyR')||padEdge(8))cycle();
  let go=kp('Space')||padEdge(9),fp=kp('KeyF')||padEdge(4)||padEdge(5);
  if(inRect(click,350,575,340,70))go=true;else if(inRect(click,710,575,220,70))fp=true;else if(inRect(click,500,520,280,40))cycle();
  if(go)startParty();else if(fp){resetScores();S='library';T=0;beep(500,.06);}
 } else if(S==='library'){
  let nx=0,ny=0;for(const id of DEV_IDS){const d=devState[id];if(d){nx+=d.x;ny+=d.y;}}
  const G=GAMES[lib.sel];
  if(Math.abs(nx)<.3&&Math.abs(ny)<.3)lib.cool=0;else if((lib.cool-=dt)<=0){
   if(ny<-.5)lib.sel=(lib.sel+GAMES.length-1)%GAMES.length,lib.mode=0;else if(ny>.5)lib.sel=(lib.sel+1)%GAMES.length,lib.mode=0;
   else if(nx>.5)lib.mode=(lib.mode+1)%G.modes.length;else if(nx<-.5)lib.mode=(lib.mode+G.modes.length-1)%G.modes.length;
   lib.cool=lib.cool<-1?.12:.22;beep(420,.03);}
  lib.scroll=clamp(lib.scroll,Math.max(0,lib.sel-8),lib.sel);
  if(click){for(let k=0;k<9;k++){const i=lib.scroll+k;if(i<GAMES.length&&inRect(click,70,140+k*58,520,50)){if(lib.sel===i)libStart();else{lib.sel=i;lib.mode=0;}}}
   GAMES[lib.sel].modes.forEach((m,k)=>{if(inRect(click,680+k*140,250,128,44))lib.mode=k;});
   if(inRect(click,760,560,300,70))libStart();if(inRect(click,70,660,160,44)){S='title';T=0;}}
  if(S==='library'){
   for(const id of DEV_IDS)if(devPressed[id]&&T>.3){if(!players.some(p=>p.dev===id)){const free=players.find(p=>!p.dev);if(free)free.dev=id;}libStart();break;}
   if(kp('Escape')||kp('Backspace')||padEdge(8)){S='title';T=0;}}
 } else if(S==='intro'){
  players.forEach(p=>{if(p.dev&&devPressed[p.dev]&&T>.8&&!ready[p.id]){ready[p.id]=true;beep(700,.05);}});
  const hs=humans();
  if(T>9||(hs.length&&T>1&&hs.every(p=>ready[p.id]))||(!hs.length&&T>3.5))startGame();
 } else if(S==='play'){
  if(T<2.4){const n=Math.floor(T/.8),pn=Math.floor((T-dt)/.8);if(n!==pn||T===dt)beep(n===2?880:440,.1);game.update(0,NOIN);}
  else{if(T-dt<2.4)beep(1046,.15);game.update(dt,inputs());}
  if(game.done){res=applyAwards(game.result);S='finish';T=0;beep(784,.1);beep(523,.2);}
 } else if(S==='finish'){if(T>1.3){S='results';T=0;}}
 else if(S==='results'){if((T>1.2&&(anyHumanPressed()||kp('Space')||click))||T>(freePlay?12:7)){if(freePlay){S='library';T=0;}else if(round<roundsTotal)nextRound();else{buildFinal();S='final';T=0;}}}
 else if(S==='final'){if(T>6.5&&(anyHumanPressed()||kp('Space')||click)){S='title';T=0;}}
}

 bg('#3a2470','#140d26');
 const fd=finalData;
 if(T<4.5&&fd.bonus.length){const k=Math.min(fd.bonus.length-1,Math.floor(T/2.25)),b=fd.bonus[k];
  txt('BONUS AWARD',W/2,140,30,'#cdbdff');txt(b.title,W/2,220,72,'#ffe066');txt(b.why+' · +10 coins',W/2,290,26,'#fff');
  b.ids.forEach((id,j)=>blob(W/2+(j-(b.ids.length-1)/2)*160,470,56,COLORS[id],{bob:Math.abs(Math.sin(T*6+j))*16,crown:true,cheer:true,tag:NAMES[id]}));return;}
 confetti(T,3);
 const w=fd.rank[0];txt(NAMES[w]+' is the Party Champion!',W/2,90,58,COLORS[w]);
 const podium=[[1,380,170],[0,640,240],[2,900,120]];
 for(const[pl,x,h]of podium){const id=fd.rank[pl];g.fillStyle=['#ffd23c','#d9e2ec','#e0a060'][pl];rr(x-110,600-h,220,h,16);g.fill();txt(String(pl+1),x,600-h/2,60,'#3a2470',undefined,false);
  blob(x,600-h-50,pl===0?54:44,COLORS[id],{crown:pl===0,cheer:pl===0,bob:Math.abs(Math.sin(T*5+pl))*(pl===0?14:6),tag:NAMES[id]+' · '+players[id].coins});}
 const fourth=fd.rank[3];txt('4th: '+NAMES[fourth]+' · '+players[fourth].coins+' coins',W/2,640,22,'#cdbdff');
 if(T>6.5)txt('Press action, Space or click to return to the title',W/2,690,20,'#cdbdff',undefined,false,600);
}
function draw(){
 g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,W,H);
 if(S==='title')drawTitle();
 else if(S==='library')drawLibrary();
 else if(S==='intro')drawIntro();
 else if(S==='play'||S==='finish'){g.save();if(shake>0)g.translate(rnd(-shake,shake),rnd(-shake,shake));game.draw();g.restore();vignette();if(S==='play')countdown(T);else{g.fillStyle='rgba(10,5,25,.35)';g.fillRect(0,0,W,H);txt('FINISH!',W/2,H/2,130,'#ffe066');}}
 else if(S==='results')drawResults();
 else if(S==='final')drawFinal();
}

let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;GT+=dt;
 try{pollDevices();update(dt);draw();}catch(e){console.error(e);}
 hit.clear();click=null;requestAnimationFrame(frame);}
requestAnimationFrame(frame);
window.__party={GAMES,players,get S(){return S;},setup:()=>setup,go:(i,m)=>{lib.sel=i;lib.mode=m;libStart();}};
}
</script>
